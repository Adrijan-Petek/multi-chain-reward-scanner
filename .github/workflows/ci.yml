name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Dry scan (offline)
        run: npm run scan:dry
